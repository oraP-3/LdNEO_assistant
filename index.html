<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ドンジャラNEO ラブライブ！ 待ち牌・点数チェッカー</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./assets/css/app.css">
</head>
<body class="bg-slate-100 font-sans text-gray-800 flex flex-col h-screen overflow-hidden">
  <div id="app" class="max-w-3xl mx-auto w-full flex-grow flex flex-col h-full relative p-2 gap-1.5 md:gap-2">
    <div class="bg-white p-2 md:p-3 rounded-lg shadow-sm flex justify-between items-center shrink-0 border-b-4 border-blue-500">
      <div>
        <h1 class="text-sm md:text-xl font-black text-blue-700 leading-tight">ドンジャラNEO ラブライブ！<br><span class="text-xs md:text-base text-gray-600">待ち牌・点数チェッカー</span></h1>
      </div>
      <div class="flex items-center gap-1.5 shrink-0 ml-2">
        <button id="open-role-settings" class="bg-blue-100 hover:bg-blue-200 text-blue-700 font-bold py-1.5 md:py-2 px-2.5 md:px-4 rounded-full text-xs md:text-sm shadow transition flex items-center gap-1">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4v2m0-6V4m12 10a2 2 0 100 4m0-4V4" /></svg>
          <span class="hidden sm:inline">役設定</span>
        </button>
        <button id="clear-hand" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-1.5 md:py-2 px-2.5 md:px-4 rounded-full text-xs md:text-sm shadow transition flex items-center gap-1">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
          <span class="hidden sm:inline">全クリア</span>
        </button>
      </div>
    </div>

    <div class="flex flex-col gap-1 shrink-0">
      <div class="flex justify-between items-center bg-white p-1.5 md:p-2 rounded-lg shadow-sm border border-gray-200">
        <div class="flex items-center gap-1.5">
          <span class="text-[10px] md:text-xs font-bold text-gray-600">自風</span>
          <div class="flex bg-gray-200 rounded p-0.5">
            <button id="btn-oya" class="px-2 md:px-3 py-1 text-[10px] md:text-xs font-bold rounded bg-white text-red-600 shadow-sm">親</button>
            <button id="btn-ko" class="px-2 md:px-3 py-1 text-[10px] md:text-xs font-bold rounded text-gray-500 hover:text-gray-700">子</button>
          </div>
        </div>
        <div class="flex items-center gap-1">
          <span class="text-[10px] md:text-xs font-bold text-gray-600">親の思想:</span>
          <div id="thought-area" class="flex gap-1 items-center min-w-[60px] justify-end"><span class="text-[9px] text-gray-400">未設定</span></div>
        </div>
      </div>
      <div class="flex bg-gray-200 rounded-lg p-1">
        <button id="btn-mode-hand" class="flex-1 py-1.5 md:py-2 text-[10px] md:text-sm font-bold rounded-md bg-white text-blue-600 shadow-sm transition border-2 border-blue-400">手牌に入力</button>
        <button id="btn-mode-visible" class="flex-1 py-1.5 md:py-2 text-[10px] md:text-sm font-bold rounded-md text-gray-500 hover:text-gray-700 transition border-2 border-transparent">場見え牌(純カラ)</button>
        <button id="btn-mode-thought" class="flex-1 py-1.5 md:py-2 text-[10px] md:text-sm font-bold rounded-md text-gray-500 hover:text-gray-700 transition border-2 border-transparent">思想設定(2枚)</button>
      </div>
    </div>

    <div id="area-hand" class="bg-white p-2 rounded-lg shadow-sm flex flex-col ring-2 ring-blue-400 transition-all shrink-0 relative overflow-hidden">
      <div id="hand-overlay" class="hidden absolute inset-0 bg-slate-200/50 z-30 backdrop-blur-[1px]"></div>
      <div class="flex justify-between items-end mb-1 relative z-40">
        <h2 class="font-bold text-gray-700 text-xs md:text-sm flex items-center gap-2">現在の手牌・鳴き牌 <span id="hand-count-badge" class="bg-blue-100 text-blue-800 px-2 py-0.5 rounded text-[10px] md:text-xs shadow-sm">0 / 9 枚</span></h2>
        <span id="hand-remove-text" class="text-[9px] md:text-[10px] text-gray-500 font-bold bg-gray-200 px-1.5 py-0.5 rounded shadow-sm">タップで外す</span>
      </div>
      <div class="bg-slate-50 p-1 md:p-1.5 rounded border border-slate-200 flex justify-center w-full relative z-20">
        <div id="selected-hand" class="grid grid-cols-9 gap-0.5 sm:gap-1 md:gap-2 w-full"></div>
      </div>
    </div>

    <div class="bg-white rounded-lg shadow-sm flex-grow flex flex-col min-h-0 overflow-hidden border-2 border-transparent" id="result-container">
      <div class="bg-slate-800 text-white font-bold p-1.5 md:p-2 text-center text-xs md:text-sm shrink-0" id="result-header">判定結果</div>
      <div id="result-body" class="flex-grow overflow-y-auto custom-scroll p-2 bg-slate-50 flex flex-col gap-2"></div>
    </div>

    <div id="palette-container" class="bg-white rounded-lg shadow-sm shrink-0 flex flex-col h-[200px] sm:h-[220px] md:h-64 border-t-4 border-gray-300 transition-colors duration-300">
      <div id="series-tabs" class="flex overflow-x-auto custom-scroll bg-gray-100 shrink-0 border-b border-gray-200"></div>
      <div id="tile-palette" class="flex-grow overflow-y-auto custom-scroll p-1.5 md:p-2 grid grid-cols-5 sm:grid-cols-7 md:grid-cols-9 gap-1.5 md:gap-2 content-start bg-slate-100"></div>
    </div>
  </div>

  <div id="clear-confirm-modal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
    <div class="bg-white rounded-xl shadow-2xl p-6 w-full max-w-sm text-center">
      <div class="text-red-500 mb-4"><svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mx-auto" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg></div>
      <h2 class="text-lg md:text-xl font-black text-gray-800 mb-2">全クリアの確認</h2>
      <p class="text-sm md:text-base text-gray-600 mb-6">手牌、場見え牌、思想セットなど<br>すべてリセットしますか？</p>
      <div class="flex justify-center gap-3">
        <button id="execute-clear" class="bg-red-500 text-white font-bold py-2 px-6 rounded-full hover:bg-red-600 shadow-md transition">はい</button>
        <button id="cancel-clear" class="bg-gray-300 text-gray-700 font-bold py-2 px-6 rounded-full hover:bg-gray-400 shadow-md transition">いいえ</button>
      </div>
    </div>
  </div>

  <div id="role-settings-modal" class="hidden fixed inset-0 bg-black/60 z-[60] flex items-center justify-center p-2 md:p-4 backdrop-blur-sm">
    <section class="bg-white rounded-xl shadow-2xl w-full max-w-3xl h-[94vh] md:h-[88vh] flex flex-col overflow-hidden">
      <header class="p-3 md:p-4 border-b flex items-center justify-between gap-2 shrink-0">
        <div>
          <h2 class="text-base md:text-xl font-black text-blue-700">役設定</h2>
          <p class="text-[10px] md:text-xs text-gray-500">OFFにした役は待ち・点数・捨て牌候補の計算から除外されます。</p>
        </div>
        <button id="close-role-settings" class="w-9 h-9 rounded-full bg-gray-100 hover:bg-gray-200 text-gray-600 font-black text-xl">×</button>
      </header>
      <div class="p-3 border-b bg-slate-50 shrink-0 flex flex-col gap-2">
        <div class="flex gap-2">
          <input id="role-search" type="search" placeholder="役名を検索" class="flex-grow border rounded-lg px-3 py-2 text-sm bg-white">
          <button id="add-custom-role" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-3 md:px-4 py-2 rounded-lg text-xs md:text-sm whitespace-nowrap">＋ 役を追加</button>
        </div>
        <div id="basic-role-warning" class="hidden bg-amber-100 border border-amber-300 text-amber-900 rounded-lg px-3 py-2 text-xs font-bold">基本役がすべて無効です。特殊役以外ではアガリが成立しません。</div>
      </div>
      <div id="role-list" class="flex-grow min-h-0 overflow-y-auto custom-scroll p-3 bg-slate-100 space-y-2"></div>
      <footer class="p-3 border-t bg-white shrink-0 flex flex-wrap gap-2 justify-between">
        <div class="flex gap-2 flex-wrap">
          <button id="export-settings" class="border border-blue-300 text-blue-700 bg-blue-50 hover:bg-blue-100 font-bold px-3 py-2 rounded-lg text-xs">JSON書き出し</button>
          <button id="import-settings" class="border border-blue-300 text-blue-700 bg-blue-50 hover:bg-blue-100 font-bold px-3 py-2 rounded-lg text-xs">JSON読み込み</button>
          <input id="import-settings-file" type="file" accept="application/json,.json" class="hidden">
        </div>
        <button id="reset-settings" class="border border-red-300 text-red-700 bg-red-50 hover:bg-red-100 font-bold px-3 py-2 rounded-lg text-xs">役設定を初期化</button>
      </footer>
    </section>
  </div>

  <div id="role-editor-modal" class="hidden fixed inset-0 bg-black/70 z-[70] flex items-center justify-center p-2 md:p-4 backdrop-blur-sm">
    <section class="bg-white rounded-xl shadow-2xl w-full max-w-3xl h-[96vh] md:h-[92vh] flex flex-col overflow-hidden">
      <header class="p-3 md:p-4 border-b flex items-center justify-between shrink-0">
        <div>
          <h2 id="role-editor-title" class="text-base md:text-xl font-black text-blue-700">役を追加</h2>
          <p class="text-[10px] md:text-xs text-gray-500">加点役または9枚固定の特殊役を作成します。</p>
        </div>
        <button id="close-role-editor" class="w-9 h-9 rounded-full bg-gray-100 hover:bg-gray-200 text-gray-600 font-black text-xl">×</button>
      </header>
      <div class="p-3 md:p-4 border-b bg-slate-50 shrink-0 space-y-3">
        <div class="grid grid-cols-2 gap-2">
          <button data-role-type="bonus" class="role-type-button bg-white text-blue-700 border-blue-500 ring-1 ring-blue-500 border-2 rounded-lg p-2 font-bold text-xs md:text-sm">加点役</button>
          <button data-role-type="standalone" class="role-type-button bg-white text-gray-500 border-gray-200 border-2 rounded-lg p-2 font-bold text-xs md:text-sm">特殊役（9枚固定）</button>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-[1fr_220px] gap-3">
          <label class="text-xs font-bold text-gray-700">役名
            <input id="custom-role-name" type="text" maxlength="40" class="mt-1 w-full border rounded-lg px-3 py-2 text-sm font-normal" placeholder="役名を入力">
          </label>
          <label class="text-xs font-bold text-gray-700">点数
            <div class="mt-1 flex items-center border rounded-lg bg-white overflow-hidden">
              <button id="score-minus" type="button" class="px-3 py-2 bg-gray-100 font-black">−</button>
              <input id="custom-role-score" type="number" min="30000" step="30000" value="90000" class="w-full px-2 py-2 text-sm text-center font-bold outline-none">
              <button id="score-plus" type="button" class="px-3 py-2 bg-gray-100 font-black">＋</button>
            </div>
          </label>
        </div>
        <div id="bonus-condition-panel" class="flex flex-col sm:flex-row sm:items-end gap-2">
          <label class="text-xs font-bold text-gray-700 flex-grow">成立条件
            <select id="custom-role-condition" class="mt-1 w-full border rounded-lg px-3 py-2 text-sm font-normal bg-white">
              <option value="all">選択した牌をすべて必要</option>
              <option value="count">選択した牌のうちN枚以上</option>
            </select>
          </label>
          <label id="required-count-label" class="hidden text-xs font-bold text-gray-700 sm:w-36">必要枚数
            <input id="custom-role-required-count" type="number" min="1" max="9" value="3" class="mt-1 w-full border rounded-lg px-3 py-2 text-sm font-normal">
          </label>
        </div>
        <div id="special-description" class="hidden bg-purple-50 border border-purple-200 text-purple-900 rounded-lg px-3 py-2 text-xs">特殊役は指定した異なる9枚がすべて揃った場合に、基本役がなくてもアガリとして扱います。</div>
        <div id="role-editor-error" class="hidden bg-red-50 border border-red-300 text-red-700 rounded-lg px-3 py-2 text-xs font-bold"></div>
        <div class="flex justify-between items-center">
          <span class="text-xs font-bold text-gray-600">指定牌</span>
          <span id="editor-selected-count" class="bg-blue-100 text-blue-800 rounded-full px-2 py-1 text-xs font-black">0枚</span>
        </div>
        <div id="editor-selected-tiles" class="flex items-center gap-1.5 overflow-x-auto custom-scroll pb-1 min-h-[32px]" aria-label="選択済みの指定牌">
          <span class="text-[10px] text-gray-400 px-1">まだ指定されていません</span>
        </div>
      </div>
      <div class="flex flex-col flex-grow min-h-0">
        <div id="editor-series-tabs" class="flex overflow-x-auto custom-scroll bg-gray-100 shrink-0 border-b border-gray-200"></div>
        <div id="editor-tile-palette" class="flex-grow overflow-y-auto custom-scroll p-2 grid grid-cols-4 sm:grid-cols-6 md:grid-cols-8 gap-2 content-start bg-slate-100"></div>
      </div>
      <footer class="p-3 border-t flex gap-2 justify-end shrink-0 bg-white">
        <button id="cancel-role-editor" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold px-4 py-2 rounded-lg text-sm">キャンセル</button>
        <button id="save-custom-role" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-5 py-2 rounded-lg text-sm">保存</button>
      </footer>
    </section>
  </div>

  <div id="confirm-modal" class="hidden fixed inset-0 bg-black/60 z-[80] flex items-center justify-center p-4 backdrop-blur-sm">
    <div class="bg-white rounded-xl shadow-2xl p-5 w-full max-w-sm text-center">
      <h2 id="confirm-title" class="text-lg font-black text-gray-800 mb-2">確認</h2>
      <p id="confirm-message" class="text-sm text-gray-600 mb-5"></p>
      <div class="flex justify-center gap-3">
        <button id="confirm-yes" class="bg-red-500 text-white font-bold py-2 px-6 rounded-full hover:bg-red-600">実行</button>
        <button id="confirm-no" class="bg-gray-300 text-gray-700 font-bold py-2 px-6 rounded-full hover:bg-gray-400">キャンセル</button>
      </div>
    </div>
  </div>

  <div id="toast-message" class="fixed top-4 left-1/2 transform -translate-x-1/2 bg-red-600 text-white font-bold px-4 py-2 rounded-full shadow-lg z-[100] transition-all duration-300 -translate-y-20 opacity-0 pointer-events-none whitespace-nowrap max-w-[92vw] text-xs md:text-sm overflow-hidden text-ellipsis">メッセージ</div>

  <script type="module" src="./assets/js/app.js"></script>
</body>
</html>
